# DOMAINS and STAGING are defined once in domains.env (see the notes there).

networks:
  certbot-nginx-net:
    name: certbot-nginx-net

services:
  cert-bootstrap:
    image: docker.io/alpine/openssl
    container_name: cert-bootstrap
    env_file:
      - domains.env
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./certbot-init/bootstrap.sh:/bootstrap.sh:ro
      - ./data/certbot/conf:/etc/letsencrypt
    # one-shot: runs, exits 0, done
    restart: "no"
    networks:
      - certbot-nginx-net

  nginx:
    image: docker.io/nginx:1.31.3
    container_name: nginx
    depends_on:
      cert-bootstrap:
        condition: service_completed_successfully
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/40-reload-watcher.sh:/docker-entrypoint.d/40-reload-watcher.sh:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    restart: unless-stopped
    networks:
      - certbot-nginx-net

  certbot:
    image: docker.io/certbot/certbot
    container_name: certbot
    # No depends_on: podman turns it into a hard libpod dependency that fails
    # once the one-shot cert-bootstrap container has exited. entrypoint.sh
    # polls nginx over HTTP instead, which covers the ordering.
    env_file:
      - domains.env
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    volumes:
      - ./certbot/entrypoint.sh:/entrypoint.sh:ro
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    restart: unless-stopped
    networks:
      - certbot-nginx-net
