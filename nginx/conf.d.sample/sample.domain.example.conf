# sample.domain.example — keep in sync with DOMAINS in domains.env.

server {
    listen 80;
    server_name sample.domain.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sample.domain.example;

    ssl_certificate     /etc/letsencrypt/live/sample.domain.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sample.domain.example/privkey.pem;

    resolver 127.0.0.1 valid=30s;

    location / {
        proxy_pass http://<host>:<port>;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
