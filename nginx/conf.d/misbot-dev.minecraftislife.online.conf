# misbot-dev.minecraftislife.online — keep in sync with DOMAINS in container-compose.yml.

server {
    listen 80;
    server_name misbot-dev.minecraftislife.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name misbot-dev.minecraftislife.online;

    ssl_certificate     /etc/letsencrypt/live/misbot-dev.minecraftislife.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/misbot-dev.minecraftislife.online/privkey.pem;

    location / {
        proxy_pass http://host.containers.internal:8182;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
